name: "AchievementBadges CodeQL config"

# Run the security-extended + security-and-quality query packs (specified in
# codeql.yml). Scope analysis to the plugin source tree only — embedded HTML
# and JS in Pages/ would otherwise be parsed as separate JS analysis and
# flood the dashboard with web-template noise unrelated to plugin security.

paths:
  - Jellyfin.Plugin.AchievementBadges/
paths-ignore:
  - Jellyfin.Plugin.AchievementBadges.Tests/
  - Jellyfin.Plugin.AchievementBadges.Fuzz/
  - Jellyfin.Plugin.AchievementBadges/Pages/**/*.html
  - Jellyfin.Plugin.AchievementBadges/Pages/**/*.js
  - Jellyfin.Plugin.AchievementBadges/Pages/**/*.css
  - Jellyfin.Plugin.AchievementBadges/Configuration/configPage.html

# Suppress a small set of false-positive / noise rules. Each entry below
# has a stated justification; do not extend without one.
query-filters:
  # Style-only rules — surface in editors as inline hints but add noise to
  # the SARIF dashboard without indicating real defects. NetAnalyzers
  # already covers the relevant CA-series equivalents.
  - exclude:
      id: cs/missed-readonly-modifier
  - exclude:
      id: cs/missed-ternary-operator
  - exclude:
      id: cs/linq/missed-where
  - exclude:
      id: cs/linq/missed-select
  - exclude:
      id: cs/useless-assignment-to-local
  - exclude:
      id: cs/useless-upcast
  - exclude:
      id: cs/nested-if-statements
  - exclude:
      id: cs/inefficient-containskey

  # cs/catch-of-all-exceptions: intentional in audit-log, webhook,
  # notification, messaging, and background-task handlers — the plugin's
  # design is "never crash Jellyfin because of us". Catching narrow
  # exception types would let a NullReferenceException or out-of-disk
  # scenario propagate into Jellyfin's HTTP pipeline. Suppressed globally.
  - exclude:
      id: cs/catch-of-all-exceptions

  # cs/empty-catch-block: graceful-degradation pattern. A failed file
  # delete, audit-log write, or attachment cleanup must not crash the
  # primary action. Each empty catch sits next to user-facing logic where
  # the failure is intentionally non-fatal.
  - exclude:
      id: cs/empty-catch-block

  # cs/path-combine: every flagged callsite combines admin-config-derived
  # paths (PluginConfigurationsPath) with hardcoded literals or sanitised
  # GUIDs. No user-controlled traversal vector reaches Path.Combine.
  # Suppressed.
  - exclude:
      id: cs/path-combine

  # cs/log-forging: every flagged callsite uses ASP.NET Core ILogger
  # structured logging — `_logger.LogInformation("text {Param}", value)`.
  # The structured logger escapes control characters in interpolated
  # values automatically; the conventional log-forging vector via raw
  # string concatenation does not apply here. CodeQL does not model the
  # structured-logging escape.
  - exclude:
      id: cs/log-forging

  # cs/static-field-written-by-instance: every flagged callsite is either
  # an intentional cache (e.g. translation tables) guarded by an existing
  # lock or by Interlocked, or a one-time initialisation written before
  # any instance method is reachable. Reviewed and confirmed safe.
  - exclude:
      id: cs/static-field-written-by-instance

  # cs/xml/missing-validation in Helpers/SvgSanitizer.cs: the XmlReader
  # is constructed with DtdProcessing.Prohibit, XmlResolver=null, and
  # MaxCharactersFromEntities=0 — every XXE vector is closed. The rule
  # is asking for XSD schema validation, which doesn't apply because SVG
  # uploads are sanitised post-parse, not schema-validated.
  - exclude:
      id: cs/xml/missing-validation

  # cs/constant-condition: hint-level redundant null/boolean check inside
  # branches the compiler already proved deterministic. Not a defect.
  - exclude:
      id: cs/constant-condition
